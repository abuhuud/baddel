<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A91E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1452A4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6C36C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B99138;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M8 4 L22 4 L22 22 Q15 28 8 22 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M10 6 L20 6 L20 20 Q15 25 10 20 Z" fill="url(#logoGrad)" opacity="0.3"/>

  <!-- Shuttlecock (top) -->
  <circle cx="15" cy="10" r="2.5" fill="url(#goldGrad)" opacity="0.9"/>
  <line x1="15" y1="12.5" x2="13" y2="16" stroke="rgba(230,195,108,0.6)" stroke-width="0.7"/>
  <line x1="15" y1="12.5" x2="15" y2="17" stroke="rgba(230,195,108,0.6)" stroke-width="0.7"/>
  <line x1="15" y1="12.5" x2="17" y2="16" stroke="rgba(230,195,108,0.6)" stroke-width="0.7"/>

  <!-- Padel ball -->
  <circle cx="15" cy="20" r="2" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
  <path d="M13.5 19.5 Q15 18.5 16.5 19.5" fill="none" stroke="rgba(230,195,108,0.5)" stroke-width="0.5"/>

  <!-- BADDEL text -->
  <text x="30" y="27" font-family="'Bebas Neue', Arial Narrow, sans-serif" font-size="22" fill="#F5F7FA" letter-spacing="3">BADDEL</text>

  <!-- Divider line -->
  <line x1="30" y1="33" x2="190" y2="33" stroke="rgba(74,145,226,0.3)" stroke-width="0.5"/>

  <!-- Sub text -->
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="7" fill="#98A6B8" letter-spacing="2.5" font-weight="600">BADMINTON + PADEL · JAKARTA</text>
</svg>
